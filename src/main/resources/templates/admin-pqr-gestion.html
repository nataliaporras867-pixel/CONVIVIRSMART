<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Gestión de PQR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        /* Paleta tipográfica y de colores exacta de CONVIVIRSMART */
        body { 
            background-color: #eef2f7; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }
        
        /* Navbar Superior Oficial (Azul Plano Corporativo) */
        .navbar { 
            background-color: #22436d !important; 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 1000; 
            height: 60px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .navbar-brand { 
            color: white !important; 
            font-weight: 700; 
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }
        .user-profile {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
        }
        .btn-salir {
            color: white;
            border: 1px solid rgba(255,255,255,0.7);
            background: transparent;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn-salir:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        
        /* Sidebar Oficial (Azul Oscuro de Gestión) */
        .sidebar { 
            background-color: #22436d; 
            height: 100vh; 
            width: 240px; 
            position: fixed; 
            top: 60px; 
            left: 0; 
            z-index: 999; 
            padding-top: 15px;
        }
        .sidebar-section-title {
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 10px 20px 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sidebar .nav-link { 
            color: rgba(255,255,255,0.7) !important; 
            padding: 10px 20px; 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.05);
            color: white !important;
        }
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white !important;
            font-weight: 500;
        }
        
        /* Contenedor de Trabajo */
        .main-content { 
            margin-left: 240px; 
            padding: 90px 35px 30px; 
        }
        
        /* Tarjetas Blandas Estilo Dashboard */
        .card-convivir {
            background: white;
            border-radius: 8px;
            border: 1px solid #dbe2ec;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .breadcrumb-custom {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 5px;
        }
        .breadcrumb-custom a {
            color: #2c619b;
            text-decoration: none;
        }
        
        /* Botones de Acción Estilo Convivir */
        .btn-convivir-primary {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 10px 20px;
            border-radius: 6px;
        }
        .btn-convivir-primary:hover {
            background-color: #0069d9;
            color: white;
        }
        
        /* Estados */
        .badge-pqr {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/admin/dashboard">CONVIVIRSMART</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="user-profile"><i class="bi bi-person-circle me-1"></i> Administrador</span>
            <a href="/inicio" class="btn-salir text-decoration-none"><i class="bi bi-box-arrow-right me-1"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <div class="sidebar-section-title">Principal</div>
    <a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-3"></i> Dashboard</a>
    
    <div class="sidebar-section-title">Gestión</div>
    <a href="/admin/residentes" class="nav-link"><i class="bi bi-people me-3"></i> Residentes</a>
    <a href="/admin/unidades" class="nav-link"><i class="bi bi-building me-3"></i> Unidades</a>
    <a href="/admin/pqrs" class="nav-link active"><i class="bi bi-chat-left-text me-3"></i> PQRs</a>
    <a href="/admin/reservas" class="nav-link"><i class="bi bi-calendar-check me-3"></i> Reservas</a>
    
    <div class="sidebar-section-title">Financiero</div>
    <a href="/admin/cuotas" class="nav-link"><i class="bi bi-cash-coin me-3"></i> Cuotas</a>
    <a href="/admin/morosos" class="nav-link"><i class="bi bi-exclamation-triangle me-3"></i> Morosos</a>
    <a href="/admin/reportes" class="nav-link"><i class="bi bi-file-earmark-bar-graph me-3"></i> Reportes</a>
</div>

<div class="main-content">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <div class="breadcrumb-custom">
                <a href="/admin/dashboard">Inicio</a> / <a href="/admin/pqrs">Dashboard</a> / <span>Gestionar</span>
            </div>
            <h2 class="fw-bold m-0" style="color: #1e293b; font-size: 1.75rem;">Bienvenido, Administrador</h2>
            
        </div>
        <a href="/admin/pqrs" class="btn btn-white btn-sm border fw-semibold px-3 py-2 bg-white text-secondary shadow-sm"><i class="bi bi-arrow-left me-2"></i>Volver</a>
    </div>

    <div th:if="${param.successActualizacion}" class="alert alert-success border-0 shadow-sm mb-4">
        <i class="bi bi-check-circle-fill me-2"></i>¡Estado actualizado con éxito!
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card-convivir h-100" style="border-left: 4px solid #2c619b;">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <span class="text-muted small">
                        <i class="bi bi-hash"></i> Radicado por ID: <strong th:text="${pqr.residenteId}"></strong>
                    </span>
                    <span class="text-muted small">
                        <i class="bi bi-clock"></i> <span th:text="${#temporals.format(pqr.fechaCreacion, 'dd/MM/yyyy hh:mm a')}"></span>
                    </span>
                </div>
                
                <h4 class="fw-bold text-dark mb-3" style="font-size: 1.35rem;" th:text="${pqr.titulo}"></h4>
                <p class="text-secondary" style="white-space: pre-line; font-size: 0.95rem; line-height: 1.5;" th:text="${pqr.descripcion}"></p>
                
                <hr style="border-color: #dbe2ec; opacity: 1;" class="my-4">
                
                <div class="d-flex gap-4">
                    <div>
                        <small class="text-muted d-block mb-1">Tipo:</small>
                        <span th:text="${pqr.tipo}" th:class="${pqr.tipo == 'RECLAMO'} ? 'badge badge-pqr bg-danger' : (${pqr.tipo == 'QUEJA'} ? 'badge badge-pqr bg-warning text-dark' : 'badge badge-pqr bg-info text-white')"></span>
                    </div>
                    <div>
                        <small class="text-muted d-block mb-1">Estado Actual:</small>
                        <span th:text="${pqr.estado}" th:class="${pqr.estado == 'PENDIENTE'} ? 'badge badge-pqr bg-secondary' : (${pqr.estado == 'EN_PROCESO'} ? 'badge badge-pqr bg-primary' : 'badge badge-pqr bg-success')"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card-convivir h-100">
                <h5 class="fw-bold text-dark mb-4" style="font-size: 1.15rem;"><i class="bi bi-arrow-repeat text-primary me-2"></i>Actualizar Estado Técnico</h5>
                
                <form th:action="@{/api/admin/pqrs/actualizar-estado}" method="post">
                    <input type="hidden" name="pqrId" th:value="${pqr.id}">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Asignar Nuevo Estado</label>
                        <select name="nuevoEstado" class="form-select" style="font-size: 0.9rem;" required>
                            <option value="PENDIENTE" th:selected="${pqr.estado == 'PENDIENTE'}">Pendiente</option>
                            <option value="EN_PROCESO" th:selected="${pqr.estado == 'EN_PROCESO'}">En Proceso</option>
                            <option value="RESUELTO" th:selected="${pqr.estado == 'RESUELTO'}">Resuelto</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Comentario / Respuesta Oficial</label>
                        <textarea name="comentario" class="form-control" rows="5" placeholder="Escriba la actualización de la administración para el residente aquí..." style="resize: none; font-size: 0.9rem;" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-convivir-primary w-100">
                        <i class="bi bi-save me-2"></i>Guardar Cambios e Historial
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
