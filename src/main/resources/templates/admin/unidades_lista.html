<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Unidades | CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; }
        body { background-color: #f0f2f5; padding-top: 56px; }
        .sidebar { background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); height: 100vh; width: 260px; position: fixed; left: 0; top: 56px; color: white; padding-top: 20px; }
        .main-content { margin-left: 260px; padding: 30px; }
        .card-header { background: #1a3c5e; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary fixed-top">
    <div class="container-fluid"><span class="navbar-brand">CONVIVIRSMART - Admin</span></div>
</nav>

<div class="sidebar p-3">
    <a href="/admin/dashboard" class="text-white text-decoration-none d-block mb-3"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/admin/unidades" class="text-white text-decoration-none"><i class="bi bi-building"></i> Gestionar Unidades</a>
</div>

<div class="main-content">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Listado de Unidades</span>
            <a href="/admin/unidades/nuevo" class="btn btn-light btn-sm text-primary">+ Nueva Unidad</a>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead><tr><th>Nombre</th><th>Torre</th><th>Propietario (Email)</th><th>Acciones</th></tr></thead>
                <tbody>
                    <tr th:each="unidad : ${unidades}">
                        <td th:text="${unidad.nombre}"></td>
                        <td th:text="${unidad.torre}"></td>
                        <td th:text="${unidad.propietarioEmail}"></td>
                        <td><a th:href="@{/admin/unidades/eliminar/{id}(id=${unidad.id})}" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
