<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Morosos - CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; --color-secondary: #2d6a9f; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        
        /* Navbar y Sidebar */
        .navbar { background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important; position: fixed; top: 0; width: 100%; z-index: 1000; height: 56px; }
        .sidebar { background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); height: calc(100vh - 56px); width: 260px; position: fixed; top: 56px; left: 0; z-index: 999; padding: 10px 0; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75) !important; padding: 8px 20px; border-radius: 8px; margin: 2px 10px; transition: all 0.3s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.2) !important; color: white !important; }
        
        .main-content { margin-left: 260px; padding: 90px 40px 30px; }
        .table-card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; background: white; }
        .card-header { background: #1a3c5e !important; color: white; padding: 15px 20px; font-weight: 600; }
        
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand text-white fw-bold" href="/admin/dashboard">CONVIVIRSMART</a>
    </div>
</nav>

<div class="sidebar">
    <a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/admin/residentes" class="nav-link"><i class="bi bi-people"></i> Residentes</a>
    <a href="/admin/cuotas" class="nav-link"><i class="bi bi-cash-coin"></i> Cuotas</a>
    <a href="/admin/morosos" class="nav-link active"><i class="bi bi-exclamation-triangle"></i> Morosos</a>
</div>

<div class="main-content">
    <h4 class="fw-bold mb-4" style="color: #1a3c5e;">Control de Residentes Morosos</h4>
    
    <div class="card table-card">
        <div class="card-header">Residentes con cuotas pendientes</div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Residente</th>
                        <th>Mes</th>
                        <th>Valor</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaMorosos">
                    <tr><td colspan="4" class="text-center p-4">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function cargarMorosos() {
        fetch('/api/cuotas/morosos')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('tablaMorosos');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-muted">No hay residentes morosos actualmente.</td></tr>';
                    return;
                }
                
                tbody.innerHTML = data.map(m => `
                    <tr>
                        <td class="fw-bold">${m.residenteNombre || 'N/A'}</td>
                        <td>${m.mes}</td>
                        <td>$${m.valor.toLocaleString()}</td>
                        <td><span class="badge bg-danger">PENDIENTE</span></td>
                    </tr>
                `).join('');
            })
            .catch(err => {
                console.error("Error al cargar:", err);
                document.getElementById('tablaMorosos').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error al cargar la información.</td></tr>';
            });
    }

    document.addEventListener("DOMContentLoaded", cargarMorosos);
</script>

</body>
</html>
