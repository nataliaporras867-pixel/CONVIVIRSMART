<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pagos - CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root { --color-primary: #1a3c5e; --color-secondary: #2d6a9f; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important; position: fixed; top: 0; width: 100%; z-index: 1000; height: 56px; }
        .navbar-brand { color: white !important; font-weight: 700; }
        .sidebar { background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); min-height: 100vh; width: 260px; position: fixed; top: 56px; left: 0; z-index: 999; padding: 20px 0; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75) !important; padding: 12px 20px; border-radius: 8px; margin: 2px 10px; transition: all 0.3s; display: flex; align-items: center; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.2); color: white !important; }
        .main-content { margin-left: 260px; padding: 90px 40px 30px; }
        .table-card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; background: white; }
        .table-header { background: #1a3c5e; color: white; padding: 15px 20px; font-weight: 600; }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/residente/dashboard">CONVIVIRSMART</a>
    </div>
</nav>

<div class="sidebar">
    <a href="/residente/dashboard" class="nav-link"><i class="bi bi-house-door me-3"></i> Mi Inicio</a>
    <a href="/residente/pagos" class="nav-link active"><i class="bi bi-credit-card me-3"></i> Mis Pagos</a>
    <a href="/residente/reservas" class="nav-link"><i class="bi bi-calendar-check me-3"></i> Mis Reservas</a>
    <a href="/residente/pqrs" class="nav-link"><i class="bi bi-chat-dots me-3"></i> Mis PQRs</a>
</div>

<div class="main-content">
    <h3 class="fw-bold mb-4" style="color: var(--color-primary);">Historial de Pagos</h3>
    
    <div class="card table-card">
        <div class="table-header">Estado de tus cuotas</div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Concepto</th>
                        <th>Mes</th>
                        <th>Valor</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaMisCuotas">
                    <tr><td colspan="5" class="text-center p-4">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function cargarMisCuotas() {
        fetch('/api/cuotas/mis-cuotas?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('tablaMisCuotas');
                tbody.innerHTML = data.map(c => `
                    <tr>
                        <td class="fw-bold">${c.descripcion || 'Cuota Administración'}</td>
                        <td>${c.mes}</td>
                        <td>$${c.valor.toLocaleString()}</td>
                        <td>
                            <span class="badge ${c.estado === 'PAGADO' ? 'bg-success' : (c.estado === 'EN_REVISION' ? 'bg-info' : 'bg-warning')}">
                                ${c.estado || 'PENDIENTE'}
                            </span>
                        </td>
                        <td>
                            ${c.estado === 'PAGADO' 
                                ? '<span class="text-success small fw-bold"><i class="bi bi-check-circle"></i> Pagado</span>' 
                                : (c.estado === 'EN_REVISION' 
                                    ? '<span class="text-info small fw-bold"><i class="bi bi-clock"></i> En revisión</span>' 
                                    : `<button class="btn btn-sm btn-primary" onclick="notificar('${c.id}')">Notificar Pago</button>`)
                            }
                        </td>
                    </tr>
                `).join('');
            });
    }

    function notificar(id) {
        fetch(`/api/cuotas/${id}/notificar-pago`, { method: 'POST' })
            .then(() => {
                setTimeout(cargarMisCuotas, 300);
            });
    }

    document.addEventListener("DOMContentLoaded", cargarMisCuotas);
</script>

</body>
</html>
