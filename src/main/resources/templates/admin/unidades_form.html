<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Unidad | CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; padding-top: 56px; }
        .sidebar { background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); height: 100vh; width: 260px; position: fixed; left: 0; top: 56px; color: white; padding-top: 20px; }
        .main-content { margin-left: 260px; padding: 30px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary fixed-top">
    <div class="container-fluid"><span class="navbar-brand">CONVIVIRSMART - Admin</span></div>
</nav>

<div class="sidebar p-3">
    <a href="/admin/dashboard" class="text-white text-decoration-none">Dashboard</a>
</div>

<div class="main-content">
    <div class="container col-md-6">
        <div class="card shadow-sm p-4">
            <h4 class="mb-4">Registrar Nueva Unidad</h4>
            <form th:action="@{/admin/unidades/guardar}" method="post" th:object="${unidad}">
                <div class="mb-3">
                    <label>Nombre / Número</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Torre</label>
                    <input type="text" th:field="*{torre}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Email del Propietario</label>
                    <input type="email" name="emailPropietario" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar y Vincular</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
