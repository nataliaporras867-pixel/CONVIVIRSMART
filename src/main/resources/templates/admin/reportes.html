<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; --color-secondary: #2d6a9f; }
        body { background-color: #f0f2f5; }

        /* Navbar Superior */
        .navbar { background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .navbar-brand { color: white !important; font-weight: 700; }
        .navbar .nav-link, .navbar span { color: rgba(255,255,255,0.9) !important; }

        /* Sidebar */
        .sidebar { background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); min-height: 100vh; width: 260px; position: fixed; top: 56px; left: 0; z-index: 999; padding: 20px 0; overflow-y: auto; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75) !important; padding: 12px 20px; border-radius: 8px; margin: 2px 10px; font-size: 0.9rem; transition: all 0.3s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.2); color: white !important; }
        .sidebar .nav-link i { width: 20px; margin-right: 8px; }
        .sidebar-title { color: rgba(255,255,255,0.45); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 15px 20px 5px; }

        /* Contenido Principal */
        .main-content { margin-left: 260px; padding: 76px 30px 30px; }

        /* Tarjetas Estilo Unificado */
        .table-card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); background: #ffffff; }
        .table-card .card-header { background: linear-gradient(135deg, #1a3c5e, #2d6a9f); color: white; font-weight: 600; border: none; padding: 15px 20px; }

        .btn-excel { background-color: #1f7246; color: white; border: none; }
        .btn-pdf { background-color: #dc3545; color: white; border: none; }
        .btn-excel:hover, .btn-pdf:hover { opacity: 0.9; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/admin/dashboard">CONVIVIRSMART</a>
    </div>
</nav>

<div class="sidebar">
    <p class="sidebar-title">Principal</p>
    <a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <p class="sidebar-title">Financiero</p>
    <a href="/admin/reportes" class="nav-link active"><i class="bi bi-file-earmark-bar-graph"></i> Reportes</a>
</div>

<div class="main-content">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/dashboard">Inicio</a></li>
            <li class="breadcrumb-item active">Reportes</li>
        </ol>
    </nav>

    <h4 class="fw-bold mb-4" style="color: #1a3c5e;">Centro de Reportes</h4>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card table-card h-100">
                <div class="card-header"><i class="bi bi-exclamation-triangle me-2"></i>Cartera Morosa</div>
                <div class="card-body p-4">
                    <p class="text-muted small">Genera el listado detallado de residentes con cuotas pendientes de pago.</p>
                    <div class="d-grid gap-2">
                        <a href="/admin/reportes/morosos/excel" class="btn btn-excel rounded-pill py-2">
                            <i class="bi bi-file-earmark-excel"></i> Exportar Excel
                        </a>
                        <a href="/admin/reportes/morosos/pdf" class="btn btn-pdf rounded-pill py-2">
                            <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
