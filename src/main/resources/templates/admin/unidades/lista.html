<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unidades - CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .main-card { border: 2.5px solid #1a3c5e; border-radius: 15px; background: white; }
        .btn-stroke { border: 2px solid #1a3c5e; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body class="bg-light p-4">
    <div class="container">

        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between mb-4">
            <h3 class="fw-bold" style="color: #1a3c5e;"> Gestión de Unidades</h3>
            <div class="d-flex gap-2">
                <a href="/admin/dashboard" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
                <a th:href="@{/admin/unidades/nueva}" class="btn btn-stroke text-primary">
                    + Nueva Unidad
                </a>
            </div>
        </div>

        <div class="card main-card shadow-sm">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Torre</th>
                        <th>Número</th>
                        <th>Piso</th>
                        <th>Tipo</th>
                        <th>Área (m²)</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="unidad : ${unidades}">
                        <td class="ps-4 fw-bold" th:text="${unidad.torre}"></td>
                        <td th:text="${unidad.numero}"></td>
                        <td th:text="${unidad.piso}"></td>
                        <td th:text="${unidad.tipo}"></td>
                        <td th:text="${unidad.area}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${unidad.estado == 'OCUPADO'} ? 'bg-success' : (${unidad.estado == 'DISPONIBLE'} ? 'bg-primary' : 'bg-warning')"
                                  th:text="${unidad.estado}">
                            </span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/unidades/editar/{id}(id=${unidad.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/admin/unidades/eliminar/{id}(id=${unidad.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Desea eliminar esta unidad?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(unidades)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No hay unidades registradas
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
