<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Noticias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; --color-secondary: #2d6a9f; }
        body { background-color: #f0f2f5; }
		.navbar { background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important; }
	     .navbar a, .navbar-brand { color: white !important; }
        .main-content { margin-left: 10px; padding: 90px 40px 30px; }
        .noticia-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e9ecef; transition: transform 0.2s; cursor: pointer; }
        .noticia-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        .noticia-header { padding: 18px 20px; }
        .noticia-title { color: var(--color-primary); font-weight: 700; }
    </style>
</head>
<body>

	<nav class="navbar navbar-expand-lg fixed-top">
	    <div class="container">
	        <a class="navbar-brand" href="/inicio">CONVIVIRSMART</a>
	        <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
	            <span class="navbar-toggler-icon"></span>
	        </button>
	        <div class="collapse navbar-collapse" id="navbarNav">
	            <ul class="navbar-nav ms-auto align-items-center gap-2">
	                <li class="nav-item"><a class="nav-link" href="/inicio">Inicio</a></li>
	                <li class="nav-item"><a class="nav-link active" href="/noticias">Noticias</a></li>
	                <li class="nav-item"><a class="nav-link" href="/zonas-comunes">Zonas Comunes</a></li>
	                <li class="nav-item"><a class="nav-link" href="/contacto">Contacto</a></li>
	            </ul>
	        </div>
	    </div>
	</nav>

<div class="main-content">
    <h2 class="fw-bold mb-4" style="color: #1a3c5e;">Cartelera Informativa</h2>
    <div class="row" id="noticiasResidentesContainer"></div>
</div>

<div class="modal fade" id="modalNoticia" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="modalImagen" src="" class="img-fluid rounded mb-3 w-100" style="max-height: 300px; object-fit: cover; display: none;">
                <div id="modalContenido" style="white-space: pre-line; text-align: justify;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById("noticiasResidentesContainer");

        fetch('/api/noticias')
            .then(response => response.json())
            .then(noticias => {
                container.innerHTML = "";
                noticias.forEach(noticia => {
                    const tituloEscapado = noticia.titulo.replace(/'/g, "\\'");
                    const contenidoEscapado = noticia.contenido.replace(/'/g, "\\'").replace(/\n/g, '\\n');
                    
					const cardHtml = `
					    <div class="col-md-6 col-lg-4 mb-4">
					        <div class="card noticia-card h-100" onclick="abrirModal('${tituloEscapado}', '${noticia.urlImagen || ''}', '${contenidoEscapado}')">
					            ${noticia.urlImagen ? 
					                `<img src="${noticia.urlImagen}" 
					                      class="card-img-top" 
					                      style="height:180px; object-fit:cover;"
					                      onerror="this.style.display='none'; this.parentElement.innerHTML += '<div class=\'text-center p-3\'><i class=\'bi bi-image fs-1 text-secondary\'></i></div>'">` 
					                : ''}
					            <div class="noticia-header">
					                <h5 class="noticia-title">${noticia.titulo}</h5>
					            </div>
					            <div class="card-body p-4">
					                <p class="text-secondary">${noticia.contenido ? noticia.contenido.substring(0, 100) : ''}...</p>
					            </div>
					        </div>
					    </div>
					`;
                    container.innerHTML += cardHtml;
                });
            });
    });

    function abrirModal(titulo, imagen, contenido) {
        document.getElementById('modalTitulo').innerText = titulo;
        document.getElementById('modalContenido').innerText = contenido;
        const img = document.getElementById('modalImagen');
        if(imagen) {
            img.src = imagen;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }
        new bootstrap.Modal(document.getElementById('modalNoticia')).show();
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
