<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Radicar PQR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { 
            --color-primary: #1a3c5e; 
            --color-secondary: #2d6a9f; 
            --color-success: #198754; 
            --color-danger: #dc3545;
        }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            height: 56px;
        }
        .navbar-brand { color: white !important; font-weight: 700; }

        /* Sidebar */
        .sidebar {
            background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%);
            min-height: 100vh;
            width: 260px;
            position: fixed;
            top: 56px;
            left: 0;
            z-index: 999;
            padding: 20px 0;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.75) !important;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 2px 10px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white !important;
        }

        /* Main content */
        .main-content {
            margin-left: 260px;
            padding: 90px 40px 30px;
        }

        /* Form Card con borde marcado idéntico a tus KPIs */
        .form-card {
            background: #ffffff;
            border: 3px solid #1a3c5e;
            border-radius: 16px;
            padding: 2rem;
            background: white;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 80px 20px 20px; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/residente/dashboard">CONVIVIRSMART</a>
        <div class="ms-auto">
            <a href="/inicio" class="btn btn-outline-light btn-sm px-3">
                <i class="bi bi-box-arrow-right me-1"></i> Salir
            </a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <a href="/residente/dashboard" class="nav-link">
        <i class="bi bi-house-door me-3"></i> Mi Inicio
    </a>
    <a href="/residente/pagos" class="nav-link">
        <i class="bi bi-credit-card me-3"></i> Mis Pagos
    </a>
    <a href="/residente/reservas" class="nav-link">
        <i class="bi bi-calendar-check me-3"></i> Mis Reservas
    </a>
    <a href="/residente/pqrs" class="nav-link active">
        <i class="bi bi-chat-dots me-3"></i> Mis PQRs
    </a>
    <a href="/residente/noticias" class="nav-link">
        <i class="bi bi-newspaper me-3"></i> Noticias
    </a>
</div>

<div class="main-content">
    <div class="mb-4">
        <h2 class="fw-bold" style="color: var(--color-primary);">Radicar PQR</h2>
        
    </div>

    <div class="card form-card mx-auto" style="max-width: 750px;">
        <form th:action="@{/residente/pqrs/guardar}" th:object="${pqr}" method="post">
            
            <div class="mb-3">
                <label class="form-label fw-bold" style="color: var(--color-primary);">Título / Asunto</label>
                <input type="text" th:field="*{titulo}" class="form-control form-control-lg" style="border: 2px solid #e9ecef; border-radius: 8px;" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="color: var(--color-primary);">Tipo de Solicitud</label>
                <select th:field="*{tipo}" class="form-select form-select-lg" style="border: 2px solid #e9ecef; border-radius: 8px;" required>
                    <option value="PETICION">Petición</option>
                    <option value="QUEJA">Queja</option>
                    <option value="RECLAMO">Reclamo</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold" style="color: var(--color-primary);">Descripción Detallada</label>
                <textarea th:field="*{descripcion}" class="form-control" rows="5" style="border: 2px solid #e9ecef; border-radius: 8px;" placeholder="Escriba aquí los hechos de manera detallada..." required></textarea>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <a href="/residente/dashboard" class="btn btn-light px-4 border fw-semibold">Cancelar</a>
                <button type="submit" class="btn text-white px-4 fw-semibold" style="background-color: var(--color-primary);">
                    <i class="bi bi-send me-2"></i>Enviar Solicitud
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
