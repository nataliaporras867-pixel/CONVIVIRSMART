<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Comunicado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; padding-top: 80px; }
        .article-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 40px; }
        .badge-comunicado { background-color: #e3f2fd; color: #1a3c5e; font-weight: 600; padding: 6px 16px; border-radius: 50px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="article-card">
                    <img th:if="${noticia.urlImagen}" th:src="${noticia.urlImagen}" 
                         class="img-fluid rounded-4 mb-4" style="width: 100%; max-height: 400px; object-fit: cover;">
                    
                    <div class="mb-3"><span class="badge-comunicado"><i class="bi bi-megaphone-fill"></i> Anuncio Oficial</span></div>
                    <h1 class="fw-bold mb-3" style="color: #1a3c5e;" th:text="${noticia.titulo}">Título</h1>
                    
                    <div class="text-muted mb-4">
                        <i class="bi bi-calendar3 me-2"></i> 
                        Publicado
                    </div>
                    
                    <hr class="mb-4">
                    
                    <div class="fs-5 text-secondary" style="white-space: pre-line; text-align: justify;" 
                         th:text="${noticia.contenido}">Contenido</div>
                    
                    <div class="mt-5">
                        <a href="/residente/noticias" class="btn btn-outline-primary"><i class="bi bi-arrow-left"></i> Volver a Noticias</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
