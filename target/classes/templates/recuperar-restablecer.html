<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña - CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; }
        body { background-color: #f0f2f5; padding: 50px 0; min-height: 100vh; display: flex; align-items: center; }
        .form-card { border: 3px solid var(--color-primary); border-radius: 20px; max-width: 500px; margin: auto; background: white; padding: 30px; }
        .form-control { border: 2px solid #ced4da; border-radius: 10px; padding: 12px; }
        .form-control:focus { border-color: var(--color-primary); box-shadow: none; }
        .btn-success { border-radius: 10px; padding: 12px; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div class="form-card shadow">
        <h3 class="fw-bold mb-3 text-center" style="color: var(--color-primary);">Nueva Contraseña</h3>
        <p class="text-muted text-center">Crea una clave segura para acceder de nuevo a CONVIVIRSMART.</p>
        
        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

        <form th:action="@{/recuperar/restablecer}" method="post" class="mt-4">
            <input type="hidden" name="token" th:value="${token}">
            
            <div class="mb-3">
                <label class="form-label fw-bold">Escribe tu nueva contraseña</label>
                <input type="password" name="password" class="form-control" required minlength="4" placeholder="Mínimo 4 caracteres">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Actualizar Contraseña</button>
        </form>
    </div>
</div>
</body>
</html>
