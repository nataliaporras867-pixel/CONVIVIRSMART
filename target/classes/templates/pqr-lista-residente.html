<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Mis PQRs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { 
            --color-primary: #1a3c5e; 
            --color-secondary: #2d6a9f; 
        }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Navbar */
        .navbar { 
            background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important; 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 1000; 
            height: 56px; 
        }
        .navbar-brand { color: white !important; font-weight: 700; }
        
        /* Sidebar */
        .sidebar { 
            background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); 
            min-height: 100vh; 
            width: 260px; 
            position: fixed; 
            top: 56px; 
            left: 0; 
            z-index: 999; 
            padding: 20px 0; 
        }
        .sidebar .nav-link { 
            color: rgba(255,255,255,0.75) !important; 
            padding: 12px 20px; 
            border-radius: 8px; 
            margin: 2px 10px; 
            transition: all 0.3s; 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { 
            background: rgba(255,255,255,0.2); 
            color: white !important; 
        }
        
        /* Main Content */
        .main-content { margin-left: 260px; padding: 90px 40px 30px; }
        .table-card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; background: white; }
        .table-card .card-header { background: linear-gradient(135deg, #1a3c5e, #2d6a9f); color: white; font-weight: 600; padding: 15px 20px; border: none; }
        
        @media (max-width: 768px) { 
            .sidebar { display: none; } 
            .main-content { margin-left: 0; padding: 80px 20px 20px; } 
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/residente/dashboard">CONVIVIRSMART</a>
        <div class="ms-auto">
            <a href="/inicio" class="btn btn-outline-light btn-sm px-3"><i class="bi bi-box-arrow-right me-1"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <a href="/residente/dashboard" class="nav-link"><i class="bi bi-house-door me-3"></i> Mi Inicio</a>
    <a href="/residente/pagos" class="nav-link"><i class="bi bi-credit-card me-3"></i> Mis Pagos</a>
    <a href="/residente/reservas" class="nav-link"><i class="bi bi-calendar-check me-3"></i> Mis Reservas</a>
    <a href="/residente/pqrs" class="nav-link active"><i class="bi bi-chat-dots me-3"></i> Mis PQRs</a>
    <a href="/residente/noticias" class="nav-link"><i class="bi bi-newspaper me-3"></i> Noticias</a>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold" style="color: var(--color-primary);">Historial de Solicitudes (PQRs)</h2>
            
        </div>
        <a href="/residente/pqrs/nueva" class="btn text-white fw-semibold" style="background-color: var(--color-primary);">
            <i class="bi bi-plus-lg me-2"></i>Nueva PQR
        </a>
    </div>

    <div class="card table-card">
        <div class="card-header">
            <i class="bi bi-journal-text me-2"></i>Mis Solicitudes Radicadas
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light border-bottom text-secondary">
                        <tr>
                            <th class="ps-4">Fecha Radicación</th>
                            <th>Asunto / Título</th>
                            <th>Tipo</th>
                            <th class="pe-4 text-center">Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(pqrs)}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="bi bi-chat-left-dots fs-1 opacity-25"></i>
                                <p class="mt-2 mb-0 small">Usted no ha radicado ninguna PQR todavía.</p>
                            </td>
                        </tr>
                        <tr th:each="pqr : ${pqrs}" class="border-bottom">
                            <td class="ps-4 text-muted small" th:text="${#temporals.format(pqr.fechaCreacion, 'dd/MM/yyyy hh:mm a')}"></td>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <a th:href="@{/residente/pqrs/detalle/{id}(id=${pqr.id})}" class="btn btn-outline-secondary btn-sm p-1 rounded-circle" title="Ver Historial de Estados">
                                        <i class="bi bi-eye-fill px-1"></i>
                                    </a>
                                    <div>
                                        <div class="fw-bold text-dark" th:text="${pqr.titulo}"></div>
                                        <small class="text-secondary d-inline-block text-truncate" style="max-width: 400px;" th:text="${pqr.descripcion}"></small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span th:text="${pqr.tipo}" 
                                      th:class="${pqr.tipo == 'RECLAMO'} ? 'badge bg-danger' : (${pqr.tipo == 'QUEJA'} ? 'badge bg-warning text-dark' : 'badge bg-info text-white')">
                                </span>
                            </td>
                            <td class="pe-4 text-center">
                                <span th:text="${pqr.estado}" 
                                      th:class="${pqr.estado == 'PENDIENTE'} ? 'badge bg-secondary' : (${pqr.estado == 'EN_PROCESO'} ? 'badge bg-primary' : 'badge bg-success')">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
