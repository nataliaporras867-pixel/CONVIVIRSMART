<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; }
        body { background-color: #f0f2f5; padding: 50px 0; min-height: 100vh; display: flex; align-items: center; }
        .form-card { border: 3px solid var(--color-primary); border-radius: 20px; max-width: 500px; margin: auto; background: white; padding: 30px; }
        .form-control { border: 2px solid #ced4da; border-radius: 10px; padding: 12px; }
        .form-control:focus { border-color: var(--color-primary); box-shadow: none; }
        .btn-primary { background-color: var(--color-primary); border: none; border-radius: 10px; padding: 12px; font-weight: 700; }
        .btn-primary:hover { background-color: #2d6a9f; }
    </style>
</head>
<body>
<div class="container">
    <div class="form-card shadow">
        <h3 class="fw-bold mb-3 text-center" style="color: var(--color-primary);">¿Olvidaste tu contraseña?</h3>
        <p class="text-muted text-center">Ingresa tu correo electrónico registrado para generar un enlace de acceso .</p>
        
        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success text-center" th:text="${mensaje}"></div>

        <div th:if="${enlaceSimulado}" class="alert alert-warning mt-3 shadow-sm">
            <p class="fw-bold mb-1">Enlace generado:</p>
            <a th:href="${enlaceSimulado}" th:text="${enlaceSimulado}" class="alert-link text-break"></a>
        </div>

        <form th:action="@{/recuperar}" method="post" class="mt-4" th:if="${enlaceSimulado == null}">
            <div class="mb-3">
                <label class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" name="correo" class="form-control" required placeholder="ejemplo@correo.com">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Enviar Enlace</button>
        </form>
        
        <div class="text-center mt-4">
            <a th:href="@{/login}" class="text-decoration-none fw-bold" style="color: var(--color-primary);">Volver al Login</a>
        </div>
    </div>
</div>
</body>
</html>
