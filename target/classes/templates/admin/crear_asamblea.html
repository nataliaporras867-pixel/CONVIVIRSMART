<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Asamblea - CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .card { border-radius: 12px; }
        .btn-primary { background-color: #1a3c5e; border: none; }
        .btn-primary:hover { background-color: #2d6a9f; }
    </style>
</head>
<body class="p-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="fw-bold mb-4" style="color: #1a3c5e;"><i class="bi bi-plus-circle"></i> Nueva Asamblea</h4>
                
                <form th:action="@{/admin/asambleas/guardar}" th:object="${asamblea}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Título de la Asamblea</label>
                        <input type="text" th:field="*{titulo}" class="form-control" required placeholder="Ej: Asamblea Extraordinaria 2026">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="3" required placeholder="Temas a tratar..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha y Hora</label>
                            <input type="datetime-local" th:field="*{fechaHora}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Enlace de Reunión</label>
                            <input type="url" th:field="*{enlaceReunion}" class="form-control" placeholder="https://zoom.us/..." required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" th:field="*{abierta}" id="estadoSwitch" checked>
                            <label class="form-check-label" for="estadoSwitch">Asamblea Abierta (Visible para propietarios)</label>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/propietario/asambleas" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5">Guardar Asamblea</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
