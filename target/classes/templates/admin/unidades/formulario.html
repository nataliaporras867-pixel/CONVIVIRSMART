<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Unidad - CONVIVIRSMART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; }
        body { background-color: #f0f2f5; padding: 50px 0; }
        .form-card { border: 3px solid var(--color-primary); border-radius: 20px; max-width: 650px; margin: auto; background: white; padding: 30px; }
        .form-control, .form-select { border: 2px solid #ced4da; border-radius: 10px; padding: 12px; }
        .form-control:focus, .form-select:focus { border-color: var(--color-primary); box-shadow: none; }
        .btn-save { background-color: var(--color-primary); color: white; border-radius: 10px; padding: 12px; font-weight: 700; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <div class="form-card shadow">
        <h3 class="fw-bold mb-4 text-center" style="color: var(--color-primary);" th:text="${titulo}">Unidad</h3>

        <form th:action="@{/admin/unidades/guardar}" th:object="${unidad}" method="post">
            <input type="hidden" th:if="${unidad.id != null and !#strings.isEmpty(unidad.id)}" th:field="*{id}">

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Torre</label>
                    <input type="text" th:field="*{torre}" class="form-control"
                           placeholder="Ej: A" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Número</label>
                    <input type="text" th:field="*{numero}" class="form-control"
                           placeholder="Ej: 101" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Piso</label>
                    <input type="text" th:field="*{piso}" class="form-control"
                           placeholder="Ej: 1">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Área (m²)</label>
                    <input type="number" th:field="*{area}" class="form-control"
                           placeholder="Ej: 75" step="0.01">
                </div>
            </div>
			
			<div class="mb-3">
			    <label class="form-label">Email del Propietario</label>
			    <input type="email" name="emailPropietario" class="form-control" 
			           th:value="${unidad.propietarioEmail}" placeholder="propietario@email.com">
			</div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Tipo</label>
                    <select th:field="*{tipo}" class="form-select">
                        <option value="">Seleccionar...</option>
                        <option value="APARTAMENTO">Apartamento</option>
                        <option value="CASA">Casa</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Estado</label>
                    <select th:field="*{estado}" class="form-select">
                        <option value="DISPONIBLE">Disponible</option>
                        <option value="OCUPADO">Ocupado</option>
                        <option value="EN_MANTENIMIENTO">En Mantenimiento</option>
                    </select>
                </div>
            </div>

            

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-save">Guardar Unidad</button>
                <a href="/admin/unidades" class="btn btn-outline-secondary w-50"
                   style="border-radius:10px; padding:12px;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
