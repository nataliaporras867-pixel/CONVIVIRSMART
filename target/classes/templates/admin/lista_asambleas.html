<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Gestión Asambleas Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; --color-secondary: #2d6a9f; }
        body { background-color: #f0f2f5; }
        .navbar { background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .navbar-brand { color: white !important; font-weight: 700; }
        .sidebar { background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); height: calc(100vh - 56px); width: 260px; position: fixed; top: 56px; left: 0; z-index: 999; padding: 10px 0; overflow-y: auto; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75) !important; padding: 8px 20px; border-radius: 8px; margin: 2px 10px; font-size: 0.9rem; transition: all 0.3s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.2) !important; color: white !important; }
        .main-content { margin-left: 260px; padding: 76px 30px 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .card-header { background: linear-gradient(135deg, #1a3c5e, #2d6a9f); color: white; padding: 15px 20px; border-radius: 12px 12px 0 0 !important; }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/admin/dashboard">CONVIVIRSMART</a>
        <div class="ms-auto"><a href="/inicio" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a></div>
    </div>
</nav>

<div class="sidebar">
    <a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/admin/asambleas/listar" class="nav-link active"><i class="bi bi-megaphone"></i> Gestión Asambleas</a>
</div>

<div class="main-content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Administración de Asambleas</h4>
                <a href="/admin/asambleas/nueva" class="btn btn-light btn-sm text-primary fw-bold">
                    <i class="bi bi-plus-circle"></i> Crear Nueva Asamblea
                </a>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Fecha y Hora</th>
                            <th>Enlace</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${asambleas}">
                            <td th:text="${a.titulo}">Título</td>
                            <td th:text="${#temporals.format(a.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                            <td><a th:href="${a.enlaceReunion}" target="_blank" class="btn btn-sm btn-info text-white">Meet</a></td>
                            <td>
                                <span th:if="${a.abierta}" class="badge bg-success">Abierta</span>
                                <span th:if="${!a.abierta}" class="badge bg-danger">Cerrada</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
