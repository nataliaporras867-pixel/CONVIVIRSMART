<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Mi Portal Residente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { 
            --color-primary: #1a3c5e; 
            --color-secondary: #2d6a9f; 
            --color-success: #198754; 
            --color-danger: #dc3545;
        }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            height: 56px;
        }
        .navbar-brand { color: white !important; font-weight: 700; }

        /* Sidebar */
        .sidebar {
            background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%);
            min-height: 100vh;
            width: 260px;
            position: fixed;
            top: 56px;
            left: 0;
            z-index: 999;
            padding: 20px 0;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.75) !important;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 2px 10px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white !important;
        }

        /* Main content */
        .main-content {
            margin-left: 260px;
            padding: 90px 40px 30px;
        }

        /* Flash Cards Minimalistas con Borde Definido */
        .kpi-card {
            background: #ffffff;
            border: 3px solid #1a3c5e; /* Línea de contorno marcada */
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            justify-content: center;
            min-height: 180px;
        }
        .kpi-card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }

        .kpi-number {
            font-size: 3rem; /* Número grande y legible */
            font-weight: 800;
            line-height: 1;
            margin-bottom: 10px;
        }

        .kpi-label {
            font-size: 1rem;
            font-weight: 700;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Accesos Rápidos */
        .quick-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            text-decoration: none;
            color: var(--color-primary);
            transition: all 0.3s;
            background: white;
        }
        .quick-card:hover {
            border-color: var(--color-primary);
            background-color: #f8f9fa;
            color: var(--color-primary);
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 80px 20px 20px; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/residente/dashboard">CONVIVIRSMART</a>
        <div class="ms-auto">
            <a href="/inicio" class="btn btn-outline-light btn-sm px-3">
                <i class="bi bi-box-arrow-right me-1"></i> Salir
            </a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <a href="/residente/dashboard" class="nav-link active">
        <i class="bi bi-house-door me-3"></i> Mi Inicio
    </a>
    <a href="/residente/pagos" class="nav-link">
        <i class="bi bi-credit-card me-3"></i> Mis Pagos
    </a>
    <a href="/residente/reservas" class="nav-link">
        <i class="bi bi-calendar-check me-3"></i> Mis Reservas
    </a>
    <a href="/residente/pqrs" class="nav-link">
        <i class="bi bi-chat-dots me-3"></i> Mis PQRs
    </a>
    <a href="/residente/noticias" class="nav-link">
        <i class="bi bi-newspaper me-3"></i> Noticias
    </a>
</div>

<div class="main-content">
    <div class="mb-5">
        <h2 class="fw-bold" style="color: var(--color-primary);">Hola, <span th:text="${nombreUsuario}">residente</span></h2>
        <p class="text-muted fs-5">Bienvenido a tu portal</p>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-12 col-md-4">
            <div class="card kpi-card" style="border-color: var(--color-danger); color: var(--color-danger);">
                <div class="kpi-number">$<span th:text="${saldoPendiente}">0</span></div>
                <div class="kpi-label">Saldo por Pagar</div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card kpi-card" style="border-color: var(--color-primary); color: var(--color-primary);">
                <div class="kpi-number" th:text="${totalPqrs}">0</div>
                <div class="kpi-label">PQRs Abiertas</div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card kpi-card" style="border-color: var(--color-success); color: var(--color-success);">
                <div class="kpi-number" style="font-size: 1.8rem;" th:text="${proximaReserva}">Sin reservas</div>
                <div class="kpi-label">Estado de Reservas</div>
            </div>
        </div>
    </div>

    <h4 class="fw-bold mb-4" style="color: var(--color-primary);">Servicios Disponibles</h4>
    <div class="row g-3">
        <div class="col-6 col-md-3">
            <a href="/residente/pagos" class="quick-card card p-4 text-center h-100">
                <div class="fw-bold">Pagar Administración</div>
            </a>
        </div>
        <div class="col-6 col-md-3">
			<a th:href="@{/residente/reservas}" class="quick-card card p-3 text-center text-decoration-none">
			    <div class="fw-bold small mt-1" style="color: #1a3c5e;">Nueva Reserva</div>
			</a>
        </div>
        <div class="col-6 col-md-3">
            <a href="/residente/pqrs/nueva" class="quick-card card p-4 text-center h-100">
                <div class="fw-bold">Radicar PQR</div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a href="/residente/comunicados" class="quick-card card p-4 text-center h-100">
                <div class="fw-bold">Ver Comunicados </div>
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
