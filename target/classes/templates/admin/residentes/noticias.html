<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Noticias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; --color-secondary: #2d6a9f; }
        body { background-color: #f0f2f5; }
        .navbar { background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important; position: fixed; top: 0; width: 100%; z-index: 1000; height: 56px; }
        .sidebar { background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); min-height: 100vh; width: 260px; position: fixed; top: 56px; left: 0; z-index: 999; padding: 20px 0; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75) !important; padding: 12px 20px; border-radius: 8px; margin: 2px 10px; transition: all 0.3s; display: flex; align-items: center; text-decoration: none; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.2); color: white !important; }
        .main-content { margin-left: 260px; padding: 90px 40px 30px; }
        .noticia-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e9ecef; transition: transform 0.2s; cursor: pointer; }
        .noticia-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        .noticia-header { padding: 18px 20px; }
        .noticia-title { color: var(--color-primary); font-weight: 700; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/residente/dashboard" style="color:white !important;">CONVIVIRSMART</a>
    </div>
</nav>

<div class="sidebar">
    <a href="/residente/dashboard" class="nav-link"><i class="bi bi-house-door me-3"></i> Mi Inicio</a>
    <a href="/residente/noticias" class="nav-link active"><i class="bi bi-newspaper me-3"></i> Noticias</a>
</div>

<div class="main-content">
    <h2 class="fw-bold mb-4" style="color: #1a3c5e;">Cartelera Informativa</h2>
    <div class="row" id="noticiasResidentesContainer"></div>
</div>

<div class="modal fade" id="modalNoticia" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="modalImagen" src="" class="img-fluid rounded mb-3 w-100" style="max-height: 300px; object-fit: cover; display: none;">
                <div id="modalContenido" style="white-space: pre-line; text-align: justify;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById("noticiasResidentesContainer");

        fetch('/api/noticias')
            .then(response => response.json())
            .then(noticias => {
                container.innerHTML = "";
                noticias.forEach(noticia => {
                    const tituloEscapado = noticia.titulo.replace(/'/g, "\\'");
                    const contenidoEscapado = noticia.contenido.replace(/'/g, "\\'").replace(/\n/g, '\\n');
                    
                    const cardHtml = `
                        <div class="col-md-6 col-lg-4 mb-4">
                            <div class="card noticia-card h-100" onclick="abrirModal('${tituloEscapado}', '${noticia.urlImagen || ''}', '${contenidoEscapado}')">
                                ${noticia.urlImagen ? `<img src="${noticia.urlImagen}" class="card-img-top" style="height:180px; object-fit:cover;">` : ''}
                                <div class="noticia-header">
                                    <h5 class="noticia-title">${noticia.titulo}</h5>
                                </div>
                                <div class="card-body p-4">
                                    <p class="text-secondary">${noticia.contenido ? noticia.contenido.substring(0, 100) : ''}...</p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                });
            });
    });

    function abrirModal(titulo, imagen, contenido) {
        document.getElementById('modalTitulo').innerText = titulo;
        document.getElementById('modalContenido').innerText = contenido;
        const img = document.getElementById('modalImagen');
        if(imagen) {
            img.src = imagen;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }
        new bootstrap.Modal(document.getElementById('modalNoticia')).show();
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
