<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Mis Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; --color-secondary: #2d6a9f; }
        body { background-color: #f0f2f5; }

        .navbar {
            background-color: #1a3c5e !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            height: 56px;
        }
        .navbar-brand { color: white !important; font-weight: 700; }

        .sidebar {
            background-color: #1a3c5e;
            min-height: 100vh;
            width: 260px;
            position: fixed;
            top: 56px;
            left: 0;
            z-index: 999;
            padding-top: 20px;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.75) !important;
            padding: 12px 20px;
            margin: 2px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white !important;
        }

        .main-content {
            margin-left: 260px;
            padding: 86px 30px 30px;
        }

        .custom-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            background: white;
        }
        
        .badge-pendiente { background-color: #ffc107; color: #000; }
        .badge-aprobada { background-color: #198754; color: white; }
        .badge-rechazada { background-color: #dc3545; color: white; }
        .badge-cancelada { background-color: #6c757d; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#">CONVIVIRSMART</a>
        <div class="ms-auto">
            <a href="/inicio" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <a href="/inicio" class="nav-link"><i class="bi bi-house-door"></i> Mi Inicio</a>
    <a href="/residente/pagos" class="nav-link"><i class="bi bi-credit-card"></i> Mis Pagos</a>
    <a href="/residente/reservas" class="nav-link active"><i class="bi bi-calendar-check"></i> Mis Reservas</a>
    <a href="/residente/pqrs" class="nav-link"><i class="bi bi-chat-left-text"></i> Mis PQRs</a>
    <a href="/noticias" class="nav-link"><i class="bi bi-newspaper"></i> Noticias</a>
</div>

<div class="main-content">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold m-0" style="color: #1a3c5e;">Portal de Reservas</h4>
    </div>

    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4">
        <i class="bi bi-check-circle-fill me-2"></i> ¡Tu solicitud de reserva fue enviada correctamente! Espera la aprobación.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-md-5 col-lg-4">
            <div class="card custom-card p-4">
                <h5 class="fw-bold mb-3" style="color: #1a3c5e;"><i class="bi bi-plus-circle me-2"></i>Nueva Solicitud</h5>
                
                <form th:action="@{/residente/reservas/solicitar}" th:object="${nuevaReserva}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Seleccionar Espacio</label>
                        <select th:field="*{zonaComunId}" class="form-select" required>
                            <option value="" disabled selected>Selecciona una zona...</option>
                            <option th:each="z : ${zonasDisponibles}" th:value="${z.id}" th:text="${z.nombre} + ' ($' + ${z.costoReserva} + ')'"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Fecha/Hora Inicio</label>
                        <input type="datetime-local" th:field="*{fechaHoraInicio}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Fecha/Hora Fin</label>
                        <input type="datetime-local" th:field="*{fechaHoraFin}" class="form-control" required>
                    </div>

                    <button type="submit" class="btn w-100 text-white rounded-pill fw-bold" style="background-color: #1a3c5e;">
                        Solicitar Reserva
                    </button>
                </form>
            </div>
        </div>

        <div class="col-md-7 col-lg-8">
            <div class="card custom-card p-0 overflow-hidden">
                <div class="p-3 text-white fw-bold" style="background: linear-gradient(135deg, #1a3c5e, #2d6a9f);">
                    <i class="bi bi-clock-history me-2"></i>Historial de mis Solicitudes
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">Zona</th>
                                <th>Desde</th>
                                <th>Hasta</th>
                                <th>Estado</th>
                                <th class="pe-3">Observaciones Admin</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${misReservas}">
                                <td class="fw-bold ps-3" style="color: #1a3c5e;"
                                    th:text="${zonasDisponibles.?[id == '__${r.zonaComunId}__'].^[true]?.nombre ?: 'Zona no encontrada'}">
                                </td>
                                <td th:text="${#temporals.format(r.fechaHoraInicio, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${#temporals.format(r.fechaHoraFin, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span th:class="'badge badge-' + ${#strings.toLowerCase(r.estado)}" th:text="${r.estado}"></span>
                                </td>
                                <td class="pe-3 text-muted small" th:text="${r.notasAdministracion != null ? r.notasAdministracion : 'Ninguna'}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(misReservas)}">
                                <td colspan="5" class="text-center text-muted py-4 small">No has solicitado ninguna reserva todavía.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
