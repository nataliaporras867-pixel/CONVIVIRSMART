<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVIVIRSMART - Detalle PQR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --color-primary: #1a3c5e; --color-secondary: #2d6a9f; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background: linear-gradient(135deg, #1a3c5e, #2d6a9f) !important; position: fixed; top: 0; width: 100%; z-index: 1000; height: 56px; }
        .navbar-brand { color: white !important; font-weight: 700; }
        .sidebar { background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%); min-height: 100vh; width: 260px; position: fixed; top: 56px; left: 0; z-index: 999; padding: 20px 0; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75) !important; padding: 12px 20px; border-radius: 8px; margin: 2px 10px; transition: all 0.3s; display: flex; align-items: center; text-decoration: none; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.2); color: white !important; }
        .main-content { margin-left: 260px; padding: 90px 40px 30px; }
        
        .detail-card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); background: white; padding: 25px; border-left: 5px solid #1a3c5e; }
        
        /* Estilos de la Línea de Tiempo / Historial */
        .timeline { border-left: 3px solid #e9ecef; padding-left: 20px; position: relative; margin-left: 10px; }
        .timeline-item { position: relative; margin-bottom: 25px; }
        .timeline-item::before { content: ""; position: absolute; left: -27px; top: 4px; width: 12px; height: 12px; background-color: #2d6a9f; border-radius: 50%; border: 2px solid white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/residente/dashboard">CONVIVIRSMART</a>
        <div class="ms-auto">
            <a href="/inicio" class="btn btn-outline-light btn-sm px-3"><i class="bi bi-box-arrow-right me-1"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <a href="/residente/dashboard" class="nav-link"><i class="bi bi-house-door me-3"></i> Mi Inicio</a>
    <a href="/residente/pagos" class="nav-link"><i class="bi bi-credit-card me-3"></i> Mis Pagos</a>
    <a href="/residente/reservas" class="nav-link"><i class="bi bi-calendar-check me-3"></i> Mis Reservas</a>
    <a href="/residente/pqrs" class="nav-link active"><i class="bi bi-chat-dots me-3"></i> Mis PQRs</a>
    <a href="/noticias" class="nav-link"><i class="bi bi-newspaper me-3"></i> Noticias</a>
</div>

<div class="main-content">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold" style="color: var(--color-primary);">Detalle de la Solicitud</h2>
          
        </div>
        <a href="/residente/pqrs" class="btn btn-light border fw-semibold"><i class="bi bi-arrow-left me-2"></i>Volver al Listado</a>
    </div>

    <div class="card detail-card mb-4">
        <div class="row g-3">
            <div class="col-md-8">
                <span class="text-muted small" th:text="'Radicado el: ' + ${#temporals.format(pqr.fechaCreacion, 'dd/MM/yyyy hh:mm a')}"></span>
                <h3 class="fw-bold mt-1 text-dark" th:text="${pqr.titulo}"></h3>
                <p class="text-secondary mt-2" th:text="${pqr.descripcion}"></p>
            </div>
            <div class="col-md-4 border-start ps-4 d-flex flex-column justify-content-center">
                <div class="mb-2">
                    <small class="text-muted d-block uppercase fw-bold">Tipo:</small>
                    <span th:text="${pqr.tipo}" th:class="${pqr.tipo == 'RECLAMO'} ? 'badge bg-danger' : (${pqr.tipo == 'QUEJA'} ? 'badge bg-warning text-dark' : 'badge bg-info text-white')"></span>
                </div>
                <div>
                    <small class="text-muted d-block uppercase fw-bold">Estado Actual:</small>
                    <span th:text="${pqr.estado}" th:class="${pqr.estado == 'PENDIENTE'} ? 'badge bg-secondary' : (${pqr.estado == 'EN_PROCESO'} ? 'badge bg-primary' : 'badge bg-success')"></span>
                </div>
            </div>
        </div>
    </div>

    <h4 class="fw-bold mb-3" style="color: var(--color-primary);"><i class="bi bi-clock-history me-2"></i>Línea de Tiempo del Estado</h4>
    <div class="card p-4 border-0 shadow-sm" style="border-radius: 16px;">
        <div class="timeline">
            <div th:if="${#lists.isEmpty(pqr.historial)}" class="text-muted small">No hay transiciones registradas.</div>
            
            <div th:each="hist : ${pqr.historial}" class="timeline-item">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-dark small">
                        Cambio de Estado: 
                        <span class="badge bg-light text-secondary border px-2 py-1 mx-1" th:text="${hist.estadoAnterior}"></span>
                        <i class="bi bi-arrow-right text-muted small"></i>
                        <span class="badge bg-dark text-white px-2 py-1 mx-1" th:text="${hist.estadoNuevo}"></span>
                    </span>
                    <small class="text-muted" th:text="${#temporals.format(hist.fechaCambio, 'dd/MM/yyyy hh:mm a')}"></small>
                </div>
                <p class="mb-1 mt-1 text-secondary small bg-light p-2 rounded" th:text="${hist.comentario}"></p>
                <small class="text-muted d-block style='font-size:0.75rem;'" th:text="'Responsable: ' + ${hist.responsable}"></small>
            </div>
        </div>
    </div>
</div>

</body>
</html>
